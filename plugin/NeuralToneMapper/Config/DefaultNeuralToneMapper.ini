[/Script/NeuralToneMapper.NTMOSettings]
; Master switch. Also toggled by the editor's Build (构建) menu entry and r.NTMO.Enable.
bEnabled=True
bMatchUnrealColorGrading=False
bMatchUnrealGamutExpansion=True
bMatchUnrealHueBehavior=False
ChromaCompensation=0.000000
MidGreyAnchorStops=0.000000
MidGreyAnchorWidth=1.600000
PeakFill=0.000000
ShadowBoost=3.000000
CurveSource=Neural
Intensity=1.000000
UserBrightnessBias=0.000000
ABLAwareness=1.000000
AssumeFullFrameFraction=0.600000
HighlightDesaturation=0.000000
Saturation=1.000000
BlackLift=0.000000
LUTSize=33
bShowDebugOverlay=False

; Trained curve network. Built at runtime from the raw .onnx (UNNEModelData::Init),
; so there is no content-browser import step and no .uasset to keep in sync.
;
; DELIBERATELY EMPTY. When this is blank -- or points at a file that does not exist --
; the plugin resolves the newest model shipped inside itself, i.e.
;     <Plugin>/Content/Models/NTMO_M_v*.onnx
; That is what makes the plugin folder portable: copy it into another project's Plugins
; directory and the AI works with no configuration at all. Set an absolute path here
; only to override the bundled model on this machine.
CurveModelFile=
CurveModelAsset=
NNERuntimeName=NNERuntimeRDGHlsl

; Curve temporal smoothing: exponential moving average on the predicted knots, in
; seconds (half-life). 0 disables it. Keeps a content change from flashing the image.
CurveSmoothingHalfLife=0.150000

; Run the network every N frames and reuse the last curve in between. Cost scales 1/N
; and the curve is a slow-moving global statistic, so 4 is imperceptible.
InferenceInterval=4

; Local operator: guide gain + half-resolution Laplacian pyramid.
bLocalOperator=True
LocalExposureStrength=0.600000
DetailStrengthMid=0.250000
DetailStrengthLow=0.100000
LocalGainClampStops=1.500000
LocalExposureScale=0.500000
LocalDetailMix=0.250000
